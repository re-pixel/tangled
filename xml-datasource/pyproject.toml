[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tangled-xml-datasource"
version = "0.1.0"
description = "XML data source plugin for Tangled graph visualization platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "tangled-api",
]

[project.entry-points."tangled.datasource"]
xml = "tangled_xml_datasource:XmlDataSource"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
