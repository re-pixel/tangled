[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tangled-yaml-datasource"
version = "0.1.0"
description = "YAML data source plugin for Tangled graph visualization platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "tangled-api",
    "pyyaml>=6.0",
]

[project.entry-points."tangled.datasource"]
yaml = "tangled_yaml_datasource:YamlDataSource"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
